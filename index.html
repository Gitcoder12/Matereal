<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matereal – Material Selector</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #f4f6fa;
            margin: 0;
            padding: 24px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 8px;
            color: #1e3a8a;
        }
        .sub {
            color: #475569;
            margin-bottom: 28px;
            border-left: 4px solid #3b82f6;
            padding-left: 16px;
        }
        .filters {
            margin-bottom: 28px;
        }
        select, button {
            padding: 10px 16px;
            border-radius: 60px;
            font-size: 0.9rem;
            border: 1px solid #cbd5e1;
            background: white;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-left: 12px;
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 18px;
            transition: 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .material-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .category {
            display: inline-block;
            background: #e2e8f0;
            border-radius: 40px;
            padding: 2px 10px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .props {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.8rem;
            margin: 12px 0;
        }
        .prop {
            background: #f8fafc;
            padding: 4px 8px;
            border-radius: 12px;
        }
        .price {
            font-size: 0.9rem;
            font-weight: bold;
            color: #15803d;
            margin-top: 8px;
        }
        .applications {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .app-tag {
            background: #dbeafe;
            color: #1e40af;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.7rem;
        }
        .loading, .error {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .error { color: #dc2626; }
        footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📦 Matereal</h1>
    <div class="sub">Find the right material for your product – filter by application, compare properties.</div>

    <div class="filters">
        <label for="appFilter">🔧 Filter by application / product type:</label>
        <select id="appFilter">
            <option value="">All applications</option>
        </select>
        <button id="resetBtn">Show all materials</button>
    </div>

    <div id="results" class="results">
        <div class="loading">Loading materials...</div>
    </div>
    <footer>Data source: materials.json (25+ materials, 15+ applications)</footer>
</div>

<script>
    let allMaterials = [];
    let applicationsList = [];

    async function loadData() {
        try {
            const response = await fetch('materials.json');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            allMaterials = data.materials;
            applicationsList = data.applications || [];

            // populate dropdown
            const select = document.getElementById('appFilter');
            select.innerHTML = '<option value="">All applications</option>';
            applicationsList.forEach(app => {
                const option = document.createElement('option');
                option.value = app;
                option.textContent = app.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                select.appendChild(option);
            });

            renderMaterials();
        } catch (err) {
            document.getElementById('results').innerHTML = `<div class="error">❌ Failed to load materials.json. Make sure the file exists in the same folder as this HTML file. ${err.message}</div>`;
        }
    }

    function renderMaterials() {
        const selectedApp = document.getElementById('appFilter').value;
        let filtered = allMaterials;
        if (selectedApp) {
            filtered = allMaterials.filter(m => m.applications && m.applications.includes(selectedApp));
        }

        const container = document.getElementById('results');
        if (filtered.length === 0) {
            container.innerHTML = '<div class="loading">No materials found for this application.</div>';
            return;
        }

        container.innerHTML = filtered.map(m => `
            <div class="card">
                <div class="material-name">${escapeHtml(m.name)}</div>
                <span class="category">${m.category}</span>
                <div class="props">
                    <div class="prop">⚖️ Density: ${m.properties.density_g_cm3} g/cm³</div>
                    <div class="prop">💪 Tensile: ${m.properties.tensile_strength_mpa} MPa</div>
                    <div class="prop">🔥 Max temp: ${m.properties.max_temp_c}°C</div>
                    <div class="prop">${m.properties.hardness_hb ? '🔩 Hardness: ' + m.properties.hardness_hb + ' HB' : (m.properties.hardness_rockwell_r ? '🌀 Hardness: ' + m.properties.hardness_rockwell_r + ' R' : (m.properties.hardness_shore_d ? '🔄 Hardness: ' + m.properties.hardness_shore_d + ' Shore D' : '—'))}</div>
                </div>
                <div class="price">💰 $${m.cost_per_kg_usd}/kg (${m.recyclable ? '♻️ Recyclable' : '🚫 Not recyclable'})</div>
                <div class="applications">
                    ${(m.applications || []).slice(0, 4).map(app => `<span class="app-tag">${app.replace(/_/g, ' ')}</span>`).join('')}
                    ${(m.applications || []).length > 4 ? '<span class="app-tag">+ more</span>' : ''}
                </div>
                <div style="font-size: 0.75rem; margin-top: 12px; color: #475569;">${escapeHtml(m.description || '')}</div>
            </div>
        `).join('');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    document.getElementById('appFilter').addEventListener('change', renderMaterials);
    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('appFilter').value = '';
        renderMaterials();
    });

    loadData();
</script>
</body>
</html>
